            "$GITHUB_WORKSPACE/stage1-candidate-outputs/repeat/coverage-data.json" \
            --base-sha "$BASE_SHA" --head-sha "$CANDIDATE_SHA" \
            --markdown "$GITHUB_WORKSPACE/stage1-outputs/base/repeat-parse-diff.md" \
            --json "$GITHUB_WORKSPACE/stage1-outputs/base/repeat-parse-diff.json"
          "$CARGO_TARGET_DIR/tool/coverage-parse-diff" data/coverage-data.json \
            "$GITHUB_WORKSPACE/stage1-candidate-outputs/coverage-data.json" \
