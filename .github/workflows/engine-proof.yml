            "$GITHUB_WORKSPACE/stage1-candidate-outputs/coverage-data.json" --fail-on-engine \
            | tee "$GITHUB_WORKSPACE/stage1-outputs/base/coverage-regression.log"
          grep -F "REGRESSED (coverage honesty) — 0 cards" "$GITHUB_WORKSPACE/stage1-outputs/base/coverage-regression.log"
