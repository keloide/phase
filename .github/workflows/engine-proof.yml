          gh api repos/keloide/phase/actions/jobs/114228038098 > "$RUNNER_TEMP/v11-job.json"
          jq -e '.id == 114228038098 and .run_id == 38056134872 and .run_attempt == 1 and .head_sha == "42408f453d37fd5ce5e647f0ea86a01a63a82675" and .name == "stage1-base" and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/v11-job.json"
