          INSTA_UPDATE=always cargo test -p phase-engine --features "$TEST_FEATURES" "$SNAPSHOT_TEST" -- --exact
          mapfile -t snapshot_paths <<< "$SNAPSHOT_PATHS"
          for path in "${snapshot_paths[@]}"; do test -s "$path"; done
          # Reject every unrelated generated/updated snapshot or source edit.
          { git diff --name-only; git ls-files --others --exclude-standard; } \
            | while IFS= read -r path; do
                [[ "$path" == crates/engine/tests/fixtures/integration_cards.json.gz || "$path" == "${snapshot_paths[0]}" || "$path" == "${snapshot_paths[1]}" ]]
