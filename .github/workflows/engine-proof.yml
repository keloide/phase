          target: wasm32-unknown-unknown
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stage1-candidate-outputs
          path: stage1-candidate-outputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stage1-base-outputs-and-parse-diff
          path: stage1-base-outputs
      - name: Run new production-path test on clean BASE with tests only overlaid
        working-directory: stage1-base-negative
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/stage1-base-negative-target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          ! git symbolic-ref -q HEAD
          test -z "$(git status --porcelain)"
          tar -xzf "$GITHUB_WORKSPACE/stage1-candidate-outputs/candidate-tests.tar.gz"
          mkdir -p client/public
          cp "$GITHUB_WORKSPACE/stage1-base-outputs/card-data.json" client/public/card-data.json
          # BASE export is essential: a candidate parsed fixture would mask a parser regression.
          python3 scripts/gen-test-fixture.py
          cargo test -p phase-engine "$RUNTIME_TEST" -- --exact --list | tee "$RUNNER_TEMP/red-test-list.log"
          grep -Fx "$RUNTIME_TEST: test" "$RUNNER_TEMP/red-test-list.log"
          set +e
          cargo test -p phase-engine "$RUNTIME_TEST" -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/runtime-red.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -E 'test result: FAILED\..*1 failed' "$RUNNER_TEMP/runtime-red.log"
          grep -F "$RED_ASSERTION_TEXT" "$RUNNER_TEMP/runtime-red.log"
          cargo test -p phase-engine "$U1_RUNTIME_TEST" -- --exact --list 2>&1 \
            | tee "$RUNNER_TEMP/u1-red-test-list.log"
          grep -Fx "$U1_RUNTIME_TEST: test" "$RUNNER_TEMP/u1-red-test-list.log"
          set +e
          cargo test -p phase-engine "$U1_RUNTIME_TEST" -- --exact --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/runtime-u1-red.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -E 'test result: FAILED\..*1 failed' "$RUNNER_TEMP/runtime-u1-red.log"
          grep -F "$U1_RED_ASSERTION_TEXT" "$RUNNER_TEMP/runtime-u1-red.log"
      - name: Discover and run exact BASE reference controls with tests only overlaid
        working-directory: stage1-base-negative
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/stage1-base-negative-target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          while IFS= read -r REFERENCE_TEST; do
            reference_log_name=${REFERENCE_TEST//:/_}
            cargo test -p phase-engine "$REFERENCE_TEST" -- --exact --list 2>&1 \
              | tee "$RUNNER_TEMP/base-reference-list-$reference_log_name.log"
            grep -Fx "$REFERENCE_TEST: test" "$RUNNER_TEMP/base-reference-list-$reference_log_name.log"
            cargo test -p phase-engine "$REFERENCE_TEST" -- --exact --nocapture 2>&1 \
              | tee "$RUNNER_TEMP/base-reference-run-$reference_log_name.log"
          done <<< "$REFERENCE_TESTS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: stage1-runtime-red-log
          path: |
            ${{ runner.temp }}/runtime-red.log
            ${{ runner.temp }}/red-test-list.log
            ${{ runner.temp }}/runtime-u1-red.log
            ${{ runner.temp }}/u1-red-test-list.log
            ${{ runner.temp }}/base-reference-*.log
          if-no-files-found: error
          retention-days: 14

  stage1-completion:
    name: stage1-completion
    needs: [stage1-candidate, stage1-base]
    if: github.repository == 'keloide/phase'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: keloide/phase
          ref: ${{ env.CANDIDATE_SHA }}
          path: stage1-completion
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly-2026-04-19
          components: rustfmt, clippy, rustc-codegen-cranelift-preview
          target: wasm32-unknown-unknown
          cache: false
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20, existing CURRENT CI action pin
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pinned-inputs
          path: restored-inputs
          repository: keloide/phase
          run-id: ${{ env.INPUT_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stage1-candidate-outputs
          path: stage1-candidate-outputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.MODE == 'final'
        with:
          name: stage1-base-outputs-and-parse-diff
          path: stage1-base-outputs
      - name: Immutable candidate runtime discriminator (generation run is preparatory)
        working-directory: stage1-completion
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/stage1-completion-target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          ! git symbolic-ref -q HEAD
          test -z "$(git status --porcelain)"
          tar -xzf "$GITHUB_WORKSPACE/restored-inputs/pinned-inputs.tar.gz"
          test ! -e .env
          test -z "${PHASE_FORGE_PATH:-}"
          test ! -e data/forge-cardsfolder
          chmod -R a-w data/mtgjson
          cp "$GITHUB_WORKSPACE/stage1-candidate-outputs/card-data.json" client/public/card-data.json
          cp "$GITHUB_WORKSPACE/stage1-candidate-outputs/"{card-data.json,coverage-data.json,semantic-audit.json,semantic-audit.md} data/
          if [ "$MODE" = generate ]; then
            cp "$GITHUB_WORKSPACE/stage1-candidate-outputs/integration_cards.json.gz" crates/engine/tests/fixtures/
            echo 'PREPARATORY ONLY: generated fixture is not yet committed at this candidate SHA.'
          else
            test -z "$(git status --porcelain --untracked-files=no)"
            python3 scripts/gen-test-fixture.py --check
          fi
          mkdir -p "$GITHUB_WORKSPACE/stage1-outputs/completion"
          test "$TEST_FEATURES" = phase-engine/test-support,phase-engine/cli,phase-engine/proptest
          python3 - <<'PYFEATURES'
          from pathlib import Path
          import re, tomllib
          manifest = tomllib.loads(Path('crates/engine/Cargo.toml').read_text())
          assert manifest['package']['name'] == 'phase-engine'
          for name, expected in [('cli', ['tracing-subscriber']), ('proptest', ['dep:proptest']), ('test-support', [])]:
              assert manifest['features'][name] == expected, (name, manifest['features'][name])
          print('Actual required feature definitions:', {n: manifest['features'][n] for n in ['test-support', 'cli', 'proptest']})
          hits = []
          for path in sorted(Path('crates').rglob('*.rs')):
              source = path.read_text()
              # Match across Rust attribute line breaks; any extra CLI/proptest occurrence refuses a presumed additive run.
              for match in re.finditer(r'feature\s*=\s*"(?:cli|proptest)"', source):
                  before, after = source[:match.start()], source[match.end():]
                  hits.append((str(path), before.count('\n') + 1, before[-50:] + match.group() + after[:50]))
          assert len(hits) == 1, ('Unaudited feature/cfg drift; root must inspect actual source. Non-additivity requires eleven cold configurations and blocks this ten-configuration protocol', hits)
          path, line, excerpt = hits[0]
          assert path == 'crates/engine/tests/integration/main.rs'
          source = Path(path).read_text()
          assert re.search(r'#\s*\[\s*cfg\s*\(\s*feature\s*=\s*"proptest"\s*\)\s*\]\s*mod\s+engine_invariants\s*;', source)
          assert re.search(r'cases\s*:\s*16\s*,', Path('crates/engine/tests/integration/engine_invariants.rs').read_text())
          print('Actual source has only the positive proptest registration:', path, line, excerpt)
          PYFEATURES
          cargo nextest list -p phase-engine -p phase-ai -p probe-pin \
            --features "$TEST_FEATURES" -E "$DISCOVERY_FILTER" --message-format json \
            > "$GITHUB_WORKSPACE/stage1-outputs/completion/focused-nextest-list.json" \
            2> "$GITHUB_WORKSPACE/stage1-outputs/completion/focused-nextest-list.stderr.log"
          python3 - "$GITHUB_WORKSPACE/stage1-outputs/completion/focused-nextest-list.json" <<'PYLIST'
          import json, sys
          data = json.load(open(sys.argv[1]))
          selected = []
          for suite in data['rust-suites'].values():
              for name, case in suite['testcases'].items():
                  if case['filter-match']['status'] == 'matches':
                      selected.append((suite['package-name'], suite['binary-name'], name))
          assert selected, 'No focused tests selected'
          for package in ['phase-engine', 'phase-ai', 'probe-pin']:
              count = sum(p == package for p, b, n in selected)
              assert count > 0, package
              print('Collected broad native-discovery tests:', package, count)
