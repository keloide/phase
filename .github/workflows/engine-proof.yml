          PHASE_REFRESH_MTGJSON: '0'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          test ! -e .env
          test -z "${PHASE_FORGE_PATH:-}"
          test ! -e data/forge-cardsfolder
          ./scripts/gen-card-data.sh
          git restore --source="$CANDIDATE_SHA" -- \
            crates/engine/data/known-tokens.toml crates/engine/data/oracle-subtypes.json \
            crates/engine/data/mtgjson-vintage
          test -z "$(git status --porcelain --untracked-files=no)"
          # Rebuild the same five bins on restored exact source; this is real warm work.
          cargo build --profile tool --features cli --bin tokens-gen --bin oracle-gen \
            --bin coverage-report --bin card-data-validate --bin coverage-parse-diff
          "$CARGO_TARGET_DIR/tool/oracle-gen" data --stats --output data/card-data.json
          "$CARGO_TARGET_DIR/tool/card-data-validate" data/card-data.json
          "$CARGO_TARGET_DIR/tool/coverage-report" data/ --all --brief > data/coverage-data.json
          "$CARGO_TARGET_DIR/tool/oracle-gen" semantic-audit data/
          test "$(jq length data/card-data.json)" -eq 35880
          cp data/card-data.json client/public/card-data.json
          test -z "$(git status --porcelain --untracked-files=no)"
          if [ "$MODE" = generate ]; then
            python3 scripts/gen-test-fixture.py
          else
            python3 scripts/gen-test-fixture.py --check
          fi
          cp data/card-data.json data/coverage-data.json data/semantic-audit.json \
            data/semantic-audit.md "$GITHUB_WORKSPACE/stage1-outputs/candidate/"
          cp crates/engine/tests/fixtures/integration_cards.json.gz "$GITHUB_WORKSPACE/stage1-outputs/candidate/"
          mapfile -t test_paths <<< "$TEST_PATHS"
          tar -czf "$GITHUB_WORKSPACE/stage1-outputs/candidate/candidate-tests.tar.gz" "${test_paths[@]}"
          # One repeat from the SAME built binary and complete pinned input root.
          # All repeat outputs live outside data; the primary export/fixture stays intact.
          chmod -R a-w data
          mkdir -p "$GITHUB_WORKSPACE/stage1-outputs/candidate/repeat"
          "$CARGO_TARGET_DIR/tool/oracle-gen" data --stats \
            --output "$GITHUB_WORKSPACE/stage1-outputs/candidate/repeat/card-data.json" \
            2>&1 | tee "$GITHUB_WORKSPACE/stage1-outputs/candidate/repeat/oracle-gen.log"
          "$CARGO_TARGET_DIR/tool/coverage-report" "$GITHUB_WORKSPACE/stage1-outputs/candidate/repeat/" \
            --all --brief > "$GITHUB_WORKSPACE/stage1-outputs/candidate/repeat/coverage-data.json" \
            2> "$GITHUB_WORKSPACE/stage1-outputs/candidate/repeat/coverage-report.log"
          git diff --name-only | while IFS= read -r path; do
            test "$path" = crates/engine/tests/fixtures/integration_cards.json.gz
          done
          test "$(jq length "$GITHUB_WORKSPACE/stage1-outputs/candidate/repeat/card-data.json")" -eq 35880
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --cached --quiet
          git status --short
          echo "Projection tool part of Step 5 passed on exact $CANDIDATE_SHA; BASE $BASE_SHA; pin $INPUT_RUN_ID."
      - name: Upload candidate normal outputs and fixture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage1-candidate-outputs
          path: stage1-outputs/candidate/
          if-no-files-found: error
          retention-days: 14

