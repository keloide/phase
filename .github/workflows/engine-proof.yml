        working-directory: stage1-completion
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/stage1-completion-target
          MTGJSON_SKIP_REFRESH: '1'
          PHASE_REFRESH_MTGJSON: '0'
          INSTA_UPDATE: 'no'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --features "$TEST_FEATURES"
          ./scripts/check-interaction-bindings.sh --check
          ./scripts/check-parser-combinators.sh "$BASE_SHA"
          ./scripts/check-prelowered-ratchet.sh
          ./scripts/check-skill-doc.sh
          ./scripts/check-engine-authorities.sh "$BASE_SHA"
          # Tool generation/export/validation/coverage/semantic ran in the exact candidate projection.
          # Its job and the independently built BASE comparator must both have succeeded.
          test "${{ needs.stage1-candidate.result }}" = success
          test "${{ needs.stage1-base.result }}" = success
          ./scripts/coverage-regression-check.sh "$GITHUB_WORKSPACE/stage1-base-outputs/coverage-data.json" \
            data/coverage-data.json --fail-on-engine | tee "$RUNNER_TEMP/completion-coverage-regression.log"
          grep -F "REGRESSED (coverage honesty) — 0 cards" "$RUNNER_TEMP/completion-coverage-regression.log"
          mkdir -p "$GITHUB_WORKSPACE/stage1-outputs/completion"
          cp "$RUNNER_TEMP/completion-coverage-regression.log" "$GITHUB_WORKSPACE/stage1-outputs/completion/coverage-regression.log"
          # Retain the actual BASE-built comparator output rather than build a second comparator here.
          cp "$GITHUB_WORKSPACE/stage1-base-outputs/parse-diff.md" "$GITHUB_WORKSPACE/stage1-outputs/completion/parse-diff.md"
          cp "$GITHUB_WORKSPACE/stage1-base-outputs/parse-diff.json" "$GITHUB_WORKSPACE/stage1-outputs/completion/parse-diff.json"
          jq -n --slurpfile base "$GITHUB_WORKSPACE/stage1-base-outputs/semantic-audit.json" \
            --slurpfile head data/semantic-audit.json '
            def findings: [.flagged_cards[]? | .card_name as $name | .findings[]? | {card_name:$name,finding:.}];
            ($base[0] | findings) as $b | ($head[0] | findings) - $b
          ' > "$GITHUB_WORKSPACE/stage1-outputs/completion/new-semantic-findings.json"
          jq -e 'length == 0' "$GITHUB_WORKSPACE/stage1-outputs/completion/new-semantic-findings.json"
          cp data/card-data.json data/coverage-data.json data/semantic-audit.json \
            data/semantic-audit.md "$GITHUB_WORKSPACE/stage1-outputs/completion/"
          cp data/card-data.json client/public/card-data.json
          python3 scripts/gen-test-fixture.py --check
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "Full composite Step 5 passed on restored source $CANDIDATE_SHA; comparison BASE $BASE_SHA; complete pin $INPUT_RUN_ID (workflow SHA $GITHUB_SHA)."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: stage1-completion-outputs
