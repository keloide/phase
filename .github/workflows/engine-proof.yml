  stage1-runtime-red:
    name: stage1-runtime-red
    needs: [stage1-candidate, stage1-base]
    if: github.repository == 'keloide/phase' && needs.stage1-candidate.outputs.mode == 'generate'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: keloide/phase
          ref: ${{ env.BASE_SHA }}
          path: stage1-base-negative
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly-2026-04-19
