jobs:
  stage1-candidate:
    name: stage1-candidate
    if: github.repository == 'keloide/phase' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      mode: ${{ steps.parameters.outputs.mode }}
      candidate_sha: ${{ steps.parameters.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: keloide/phase
          ref: ${{ env.CANDIDATE_SHA }}
          path: stage1-candidate-projection
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable candidate and parameters
        id: parameters
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: stage1-candidate-projection
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MODE" == generate || "$MODE" == final ]]
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          test "$INPUT_RUN_ID" = 37483983597
          test "$GATED_SETS_AS_OF" = 2026-10-05
          test "$MODE" = final
          test "$BASE_SHA" = "$PHASE_BASE_SHA"
          test "$PHASE_BASE_SHA" = ab1363d1f30141c118db0c83de0da617e0c07c65
          test "$GITHUB_REF_NAME" = engine-proof/fra-stingerquill-9
          ! grep -F 'REPLACE_' <<< "$U3_PRODUCTION_PATCH"
          while IFS= read -r -d '' path; do
            grep -Fx -- "$path" <<< "$PHASE_SCOPE_PATHS" > /dev/null
          done < <(git diff --no-renames --name-only -z "$PHASE_BASE_SHA" "$CANDIDATE_SHA")
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          mapfile -t snapshot_paths <<< "$SNAPSHOT_PATHS"
          test "${#snapshot_paths[@]}" -eq 2
          test "${snapshot_paths[0]}" = crates/engine/src/parser/oracle_ir/snapshots/engine__parser__oracle_ir__snapshot_tests__essence_burn_ir.snap
          test "${snapshot_paths[1]}" = crates/engine/src/parser/oracle_ir/snapshots/engine__parser__oracle_ir__snapshot_tests__essence_burn_lowered.snap
          for path in "${snapshot_paths[@]}"; do
            [[ "$path" == crates/engine/src/parser/oracle_ir/snapshots/*.snap && "$path" != *..* ]]
            if [ "$MODE" = final ]; then test -s "$path"; fi
          done
          test "$SNAPSHOT_TEST" = parser::oracle_ir::snapshot_tests::essence_burn_ir_and_lowered
          test "$CANDIDATE_SHA" != "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          ! git symbolic-ref -q HEAD
          test -z "$(git status --porcelain)"
          test ! -e .env
          test -z "${PHASE_FORGE_PATH:-}"
          python3 - <<'PYFEATURES'
          from pathlib import Path
          import re, tomllib
          manifest = tomllib.loads(Path('crates/engine/Cargo.toml').read_text())
          assert manifest['package']['name'] == 'phase-engine'
          for name, expected in [('cli', ['tracing-subscriber']), ('proptest', ['dep:proptest']), ('test-support', [])]:
              assert manifest['features'][name] == expected, (name, manifest['features'][name])
          print('Actual required feature definitions:', {n: manifest['features'][n] for n in ['test-support', 'cli', 'proptest']})
          hits = []
          for path in sorted(Path('crates').rglob('*.rs')):
              source = path.read_text()
              # Match across Rust attribute line breaks; any extra CLI/proptest occurrence refuses a presumed additive run.
              for match in re.finditer(r'feature\s*=\s*"(?:cli|proptest)"', source):
                  before, after = source[:match.start()], source[match.end():]
                  hits.append((str(path), before.count('\n') + 1, before[-50:] + match.group() + after[:50]))
          assert len(hits) == 1, ('Unaudited feature/cfg drift; root must inspect actual source. Non-additivity requires eleven cold configurations and blocks this ten-configuration protocol', hits)
          path, line, excerpt = hits[0]
          assert path == 'crates/engine/tests/integration/main.rs'
          source = Path(path).read_text()
          assert re.search(r'#\s*\[\s*cfg\s*\(\s*feature\s*=\s*"proptest"\s*\)\s*\]\s*mod\s+engine_invariants\s*;', source)
          assert re.search(r'cases\s*:\s*16\s*,', Path('crates/engine/tests/integration/engine_invariants.rs').read_text())
          print('Actual source has only the positive proptest registration:', path, line, excerpt)
          PYFEATURES
          git cat-file -e "$BASE_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
          while IFS= read -r -d '' path; do
            grep -Fx -- "$path" <<< "$SCOPE_PATHS" > /dev/null
          done < <(git diff --no-renames --name-only -z "$BASE_SHA" "$CANDIDATE_SHA")
          refs=("$FROZEN_BASE_BRANCH" "$MERGED_SOURCE_BRANCH" "$FINAL_HEAD_BRANCH")
          test "${refs[0]}" != "${refs[1]}"
          test "${refs[0]}" != "${refs[2]}"
          test "${refs[1]}" != "${refs[2]}"
          for ref in "${refs[@]}"; do
            [[ "$ref" == engine-proof/* && "$ref" != "$GITHUB_REF_NAME" ]]
            git check-ref-format "refs/heads/$ref"
            if gh api "repos/keloide/phase/git/ref/heads/$ref" > /dev/null 2> "$RUNNER_TEMP/publication-ref-error"; then
              echo 'Publication ref already exists; refuse stale continuation.' >&2
              exit 1
            else
              grep -q 'HTTP 404' "$RUNNER_TEMP/publication-ref-error"
            fi
          done
          ./scripts/engine-source-hash.sh "$CANDIDATE_SHA"
          printf '%s\n' "Candidate projection source: $CANDIDATE_SHA; base: $BASE_SHA; mode: $MODE"
          while IFS= read -r path; do
            [[ "$path" == crates/engine/tests/integration/*.rs && "$path" != *..* ]]
            test -f "$path"
          done <<< "$TEST_PATHS"
      - name: Verify fixed V11 stage1-candidate native evidence for artifact reuse
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: stage1-candidate-projection
        shell: bash
        run: |
          set -euo pipefail
          test "$BASE_SHA" = ab1363d1f30141c118db0c83de0da617e0c07c65
          test "$CANDIDATE_SHA" = e8aa66ec424c93bc06520b581cc142683504f18d
          test "$PHASE_BASE_SHA" = "$BASE_SHA"
          test "$INPUT_RUN_ID" = 37483983597
          test "$MODE" = final
          test "$TEST_FEATURES" = phase-engine/test-support,phase-engine/cli,phase-engine/proptest
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          ! git symbolic-ref -q HEAD
          test -z "$(git status --porcelain)"
          test "$(git diff --no-renames --name-only "$CANDIDATE_SHA" 42408f453d37fd5ce5e647f0ea86a01a63a82675)" = .github/workflows/engine-proof.yml
          git show 42408f453d37fd5ce5e647f0ea86a01a63a82675:.github/workflows/engine-proof.yml > "$RUNNER_TEMP/v11-workflow.yml"
          grep -Fx '  BASE_SHA: ab1363d1f30141c118db0c83de0da617e0c07c65' "$RUNNER_TEMP/v11-workflow.yml"
          grep -Fx '  CANDIDATE_SHA: e8aa66ec424c93bc06520b581cc142683504f18d' "$RUNNER_TEMP/v11-workflow.yml"
          grep -Fx "  INPUT_RUN_ID: '37483983597'" "$RUNNER_TEMP/v11-workflow.yml"
          gh api repos/keloide/phase/actions/runs/38056134872 > "$RUNNER_TEMP/v11-run.json"
          jq -e '.id == 38056134872 and .run_attempt == 1 and .head_sha == "42408f453d37fd5ce5e647f0ea86a01a63a82675" and .head_branch == "engine-proof/fra-stingerquill-9" and .event == "push" and .status == "completed" and .conclusion == "failure"' "$RUNNER_TEMP/v11-run.json"
          gh api repos/keloide/phase/actions/jobs/114224943644 > "$RUNNER_TEMP/v11-job.json"
          jq -e '.id == 114224943644 and .run_id == 38056134872 and .run_attempt == 1 and .head_sha == "42408f453d37fd5ce5e647f0ea86a01a63a82675" and .name == "stage1-candidate" and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/v11-job.json"
          echo 'Reusing exact V11 stage1-candidate normal artifacts; this job performs no native Tool build or new measurement.'
      - name: Restore fixed V11 stage1-candidate normal artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stage1-candidate-outputs
          path: stage1-outputs/candidate
          repository: keloide/phase
          run-id: '38056134872'
          github-token: ${{ github.token }}
      - if: ${{ false }} # Fixed V11 reuse; original native step preserved below.
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly-2026-04-19
          components: rustfmt, clippy, rustc-codegen-cranelift-preview
          target: wasm32-unknown-unknown
          cache: false
      - name: Restore pinned full inputs for subsequent run
        if: ${{ false }} # Fixed V11 reuse; original pinned-input restore preserved.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pinned-inputs
          path: restored-inputs
          repository: keloide/phase
          run-id: ${{ env.INPUT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download inputs with the supported pipeline, or unpack the original inputs
        if: ${{ false }} # Fixed V11 reuse; original native script preserved.
        working-directory: stage1-candidate-projection
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/stage1-candidate-projection-target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/stage1-outputs/candidate" "$GITHUB_WORKSPACE/stage1-outputs/inputs"
          if [ "$INPUT_RUN_ID" = 0 ]; then
            test "$MODE" = generate
            ./scripts/gen-card-data.sh
